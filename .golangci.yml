version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - depguard
  settings:
    depguard:
      rules:
        yaml:
          deny:
            - pkg: gopkg.in/yaml.v3
              desc: archived upstream, use go.yaml.in/yaml/v4
            - pkg: go.yaml.in/yaml/v3
              desc: frozen series, use go.yaml.in/yaml/v4

formatters:
  enable:
    - gofmt
    - goimports
