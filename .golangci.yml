version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - depguard
  settings:
    depguard:
      rules:
        yaml:
          deny:
            - pkg: gopkg.in/yaml.v3
              desc: archived upstream, use the maintained fork go.yaml.in/yaml/v3

formatters:
  enable:
    - gofmt
    - goimports
